[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "menu-alchemist"
version = "0.2.0"
description = "Turn a menu photo + description into a structured drink recipe and shopping list"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "google-genai>=1.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pillow>=10.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "bcrypt>=4.1",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
# Recursive globs matter: static/views/ and static/icons/ are not packages, so
# a plain "static/*" silently ships a half-broken frontend.
app = ["data/*.json", "static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
