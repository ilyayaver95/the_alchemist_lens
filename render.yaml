services:
  - type: web
    name: menu-alchemist
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: VISION_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false  # set in the Render dashboard, never in git
