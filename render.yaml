databases:
  - name: menu-alchemist-db
    plan: free
    databaseName: menu_alchemist
    user: menu_alchemist

services:
  - type: web
    name: menu-alchemist
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: VISION_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false  # set in the Render dashboard, never in git
      - key: DATABASE_URL
        fromDatabase:
          name: menu-alchemist-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true  # rotating this signs everyone out; that's the only cost
      - key: COOKIE_SECURE
        value: true  # Render serves over HTTPS, so the session cookie must be Secure
